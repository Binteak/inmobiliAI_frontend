server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Los PDF pueden pesar hasta 12 MB (límite del backend).
  client_max_body_size 15m;

  location /api/ {
    proxy_pass http://backend:8000;
    proxy_read_timeout 120s;
  }

  location = /health {
    proxy_pass http://backend:8000;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
