
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg" x1="8" y1="5" x2="58" y2="61" gradientUnits="userSpaceOnUse">
      <stop stop-color="#243B61"></stop>
      <stop offset="1" stop-color="#111D33"></stop>
    </linearGradient>
    <linearGradient id="accent" x1="23" y1="14" x2="48" y2="43" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7DD3FC"></stop>
      <stop offset="1" stop-color="#3B82F6"></stop>
    </linearGradient>
  </defs>

  <!-- Fondo original -->
  <rect width="64" height="64" rx="18" fill="url(#bg)"></rect>

  <!-- Dibujo reducido y centrado -->
  <g transform="translate(7 7) scale(.78)">
    <!-- Edificio -->
    <path d="M13 54V28L31 17L49 28V54H13Z" stroke="#F8FAFC" stroke-width="2.6" stroke-linejoin="round"></path>

